   name: Build Pro L
   on: workflow_dispatch
   jobs:
     build:
       runs-on: windows-latest
       defaults:
         run:
           working-directory: "Pro L"
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
             node-version: 20
         - run: npm install
         - run: npx electron-builder --win --publish never
         - uses: actions/upload-artifact@v4
           with:
             name: ProL-exe
             path: "Pro L/dist/*.exe"
